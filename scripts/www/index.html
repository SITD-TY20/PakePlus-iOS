<!DOCTYPE html>

<html lang="zh-CN" data-theme="light">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>魏玛记账 · Papiermark Ledger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

<style>

:root {

  --bg: #0b0d12;

  --surface: #141821;

  --surface-2: #1b202b;

  --border: #262d3a;

  --text: #e6eaf2;

  --muted: #8a94a8;

  --accent: #d4a24c;

  --accent-glow: rgba(212, 162, 76, .12);

  --green: #4caf7a;

  --red: #e0556a;

  --input-bg: #0d1016;

  --hover-bg: rgba(255,255,255,.02);

  --group-header-hover: #222836;

  --summary-end: #11151d;

  --body-glow: #1b2233;

  --modal-overlay: rgba(0,0,0,.65);

  --radius: 14px;

  --shadow: 0 12px 36px rgba(0, 0, 0, .35);

  --num-font: 'Hoefler Text', 'Georgia', 'EB Garamond', 'Times New Roman', serif;

  --swipe-action-width: 88px;

}

:root[data-theme="light"] {

  --bg: #f4f5f7;

  --surface: #ffffff;

  --surface-2: #eef0f4;

  --border: #d8dce4;

  --text: #1a1d24;

  --muted: #6b7280;

  --accent: #b8862f;

  --accent-glow: rgba(184, 134, 47, .15);

  --green: #2e8b57;

  --red: #c0392b;

  --input-bg: #ffffff;

  --hover-bg: rgba(0,0,0,.03);

  --group-header-hover: #e3e6ec;

  --summary-end: #f7f8fa;

  --body-glow: #e8ecf3;

  --modal-overlay: rgba(0,0,0,.35);

  --shadow: 0 12px 36px rgba(0, 0, 0, .12);

}


* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans JP", "Noto Sans", sans-serif;

  background: radial-gradient(1100px 500px at 50% -8%, var(--body-glow) 0%, var(--bg) 60%);

  color: var(--text);

  min-height: 100vh;

  padding: 20px 14px 80px;

  -webkit-font-smoothing: antialiased;

  transition: background .3s, color .3s;

}

.wrap { max-width: 860px; margin: 0 auto; }


header {

  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;

  gap: 12px; margin-bottom: 20px;

}

header h1 { font-size: 20px; font-weight: 700; letter-spacing: .02em; }

header h1 span { color: var(--accent); }

.header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.lang-select {

  background: var(--surface); border: 1px solid var(--border); color: var(--text);

  padding: 8px 12px; border-radius: 10px; font-size: 13px; outline: none; cursor: pointer;

}

.lang-select:focus { border-color: var(--accent); }

.btn {

  display: inline-flex; align-items: center; justify-content: center; gap: 6px;

  padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);

  background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500;

  cursor: pointer; transition: .18s; white-space: nowrap;

}

.btn:hover { border-color: var(--accent); background: var(--surface-2); }

.btn:active { transform: scale(.97); }

.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }

.btn-primary:hover { background: var(--accent); filter: brightness(1.1); }

:root[data-theme="light"] .btn-primary { color: #fff; }

.btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

.btn-danger { color: var(--red); border-color: var(--red); }

.btn-danger:hover { background: var(--red); color: #fff; }


.theme-toggle {

  width: 36px; height: 36px;

  border: 1px solid var(--border);

  background: var(--surface);

  border-radius: 10px;

  font-size: 16px;

  color: var(--text);

  cursor: pointer;

  display: inline-flex; align-items: center; justify-content: center;

  transition: .18s;

}

.theme-toggle:hover { border-color: var(--accent); background: var(--surface-2); }

.theme-toggle:active { transform: scale(.95); }


.rate-bar {

  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;

  gap: 10px; padding: 12px 16px; background: var(--surface);

  border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px;

  font-size: 12.5px; color: var(--muted);

  transition: background .3s, border-color .3s;

}

.rate-bar .rate-val {

  font-family: var(--num-font);

  font-variant-numeric: oldstyle-nums;

  font-feature-settings: "onum" 1;

  font-style: italic;

  color: var(--accent); font-weight: 700;

  transition: color 0.3s, transform 0.2s; display: inline-block; min-width: 60px; text-align: right;

}

.rate-bar .rate-val.flash { animation: valueFlash 0.6s ease; }

@keyframes valueFlash {

  0% { color: var(--green); transform: scale(1.1); }

  100% { color: var(--accent); transform: scale(1); }

}

.rate-bar .status { display: flex; align-items: center; gap: 6px; }

.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

.dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }

.dot.loading { background: var(--accent); animation: pulse 1s infinite; }

.dot.err { background: var(--red); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }


.icon-btn.spinning { animation: spin .8s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.icon-btn:disabled { opacity: .5; cursor: wait; }


/* 三卡片纵向单列三行显示 */

.summary-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }

.summary-card {

  padding: 16px 10px; background: linear-gradient(180deg, var(--surface), var(--summary-end));

  border: 1px solid var(--border); border-radius: var(--radius);

  text-align: center; min-width: 0; overflow: hidden;

  transition: background .3s, border-color .3s;

}

.summary-card .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; white-space: nowrap; }

.summary-card .value { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }

.summary-card.income .value { color: var(--green); }

.summary-card.expense .value { color: var(--red); }

.summary-card.total .value { color: var(--accent); }


.group { margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; transition: background .3s, border-color .3s; }

.group.month-group { margin: 8px 12px; border-radius: 10px; }

.group.day-group { margin: 8px 12px; border-radius: 8px; }

.group-header {

  display: flex; align-items: center; justify-content: space-between;

  padding: 12px 16px; cursor: pointer; user-select: none;

  background: var(--surface-2); transition: background .15s;

}

.group-header:hover { background: var(--group-header-hover); }

.gh-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.chevron { font-size: 10px; color: var(--muted); transition: transform .2s; }

.group.open > .group-header .chevron { transform: rotate(90deg); }

.group-title { font-size: 14px; font-weight: 600; }

.gh-stats { display: flex; gap: 10px; font-size: 11.5px; flex-wrap: wrap; justify-content: flex-end; }

.gh-stat.income { color: var(--green); }

.gh-stat.expense { color: var(--red); }

.gh-stat.total { color: var(--accent); font-weight: 700; }


.group-body { display: none; border-top: 1px solid var(--border); }

.group.open > .group-body { display: block; }


/* 条目左滑布局：操作按钮后置 + 内容层实色覆盖 */

.entry {
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
}

.entry-content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  transition: transform 0.2s ease;
  will-change: transform;
}

/* 悬停效果用内部伪元素实现，保持内容层全程实色，不透出底部操作按钮 */

.entry-content::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--hover-bg);
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: none;
  z-index: 0;
}

.entry:hover .entry-content::before {
  opacity: 1;
}

.entry-icon {
  position: relative;
  z-index: 1;
  width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; flex: none;
  border: 1px solid var(--border);
  font-size: 20px; font-weight: 800; line-height: 1;
}

.entry-main {
  position: relative;
  z-index: 1;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* 名称横向滑动容器 - 隐藏滚动条，支持鼠标/触摸拖拽 */

.entry-name-scroll {
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
  cursor: grab;
  user-select: none;
}

.entry-name-scroll:active {
  cursor: grabbing;
}

.entry-name-scroll::-webkit-scrollbar {
  display: none;
}

.entry-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  display: inline-block;
}

/* 价格右对齐，占满宽度，强制单行，字号自适应 */

.entry-price {

  text-align: right;

  width: 100%;

}

.entry-price .p-main {

  font-weight: 700;

  white-space: nowrap;

  overflow: hidden;

}

.entry-price .p-sub {

  color: var(--muted);

  margin-top: 2px;

  white-space: nowrap;

  overflow: hidden;

}

/* 左滑操作按钮区 - 默认被内容层完全覆盖 */

.entry-actions {

  position: absolute;

  top: 0;

  right: 0;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: flex-end;

  gap: 8px;

  padding: 0 16px;

  z-index: 1;

}

.icon-btn {

  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;

  background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;

  display: flex; align-items: center; justify-content: center; transition: .15s;

}

.icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }

.icon-btn.del-btn:hover { color: var(--red); border-color: var(--red); background: var(--hover-bg); }


.empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

.empty .big { font-size: 36px; margin-bottom: 10px; opacity: .5; }


/* 金额数字统一字体 */

.money-num {

  font-family: var(--num-font);

  font-variant-numeric: oldstyle-nums;

  font-feature-settings: "onum" 1;

  font-style: italic;

}

.money-sym { /* 货币符号保持原字体 */ }


.footer-area {

  margin-top: 32px; padding-top: 20px; border-top: 1px dashed var(--border);

}

.rate-info {

  text-align: center; font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 20px;

}

.rate-info strong {

  font-family: var(--num-font);

  font-variant-numeric: oldstyle-nums;

  font-feature-settings: "onum" 1;

  font-style: italic;

  color: var(--accent);

}

.cloud-guide {

  background: var(--surface-2); padding: 16px; border-radius: 12px;

  font-size: 12.5px; color: var(--muted); line-height: 1.8; text-align: left;

  border: 1px solid var(--border);

}

.cloud-guide b { color: var(--text); display: block; margin-bottom: 2px; }


.modal-overlay {

  position: fixed; inset: 0; background: var(--modal-overlay); backdrop-filter: blur(4px);

  display: none; align-items: flex-end; justify-content: center; z-index: 1000; padding: 0;

}

.modal-overlay.show { display: flex; }

@media(min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }

.modal {

  background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh;

  overflow-y: auto; border-radius: 20px 20px 0 0; border: 1px solid var(--border);

  box-shadow: var(--shadow); animation: slideUp .25s ease;

  transition: background .3s;

}

@media(min-width: 640px) { .modal { border-radius: var(--radius); } }

@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }

.modal-header h2 { font-size: 16px; font-weight: 700; }

.modal-body { padding: 18px 20px; }

.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--surface); }


.form-group { margin-bottom: 16px; }

.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }

.form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea {

  width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;

  background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; transition: .15s;

  font-family: inherit;

}

.form-group input[type="number"] {

  font-family: var(--num-font);

  font-variant-numeric: oldstyle-nums;

  font-feature-settings: "onum" 1;

  font-style: italic;

}

.form-group textarea { resize: vertical; min-height: 100px; font-size: 13px; font-family: monospace; }

.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.form-group input[type="number"]::-webkit-outer-spin-button, .form-group input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

.form-group input[type="number"] { -moz-appearance: textfield; }


.date-input-group {

  display: flex;

  align-items: center;

  gap: 8px;

}

.date-input-group input {

  text-align: center;

  padding: 10px 6px;

  font-size: 16px;

  font-weight: 600;

  font-family: var(--num-font);

  font-variant-numeric: oldstyle-nums;

  font-feature-settings: "onum" 1;

  font-style: italic;

}

.date-input-group input#fYear { flex: 1.5; }

.date-input-group input#fMonth { flex: 1; }

.date-input-group input#fDay { flex: 1; }

.date-input-group span {

  font-size: 14px;

  color: var(--muted);

  user-select: none;

}


/* 全屏历史页面 */

.history-overlay {

  position: fixed; inset: 0; background: var(--bg); z-index: 3000;

  display: none; flex-direction: column; align-items: center;

  overflow-y: auto; padding: 40px 20px;

  transition: background .3s;

}

.history-overlay.show { display: flex; }

.history-container {

  max-width: 760px; width: 100%;

  background: var(--surface); border: 1px solid var(--border);

  border-radius: 20px; padding: 40px; box-shadow: var(--shadow);

  transition: background .3s;

}

.history-rate {

  text-align: center; font-size: 18px; font-weight: 600;

  color: var(--accent); margin-bottom: 30px; padding-bottom: 15px;

  border-bottom: 1px dashed var(--border);

  font-family: var(--num-font);

  font-variant-numeric: oldstyle-nums;

  font-feature-settings: "onum" 1;

  font-style: italic;

}

.history-title { font-size: 24px; margin-bottom: 24px; text-align: center; }

.history-content { font-size: 15px; line-height: 1.9; color: var(--muted); }

.history-content p { margin-bottom: 16px; }

.history-content b { color: var(--text); }

.history-close-btn {

  position: fixed; top: 20px; right: 20px; width: 44px; height: 44px;

  border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border);

  color: var(--text); font-size: 20px; display: flex; align-items: center; justify-content: center;

  cursor: pointer; z-index: 3010; transition: .2s;

}

.history-close-btn:hover { background: var(--red); border-color: var(--red); color: #fff; }


.toast {

  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);

  background: var(--surface-2); color: var(--text); border: 1px solid var(--border);

  padding: 10px 20px; border-radius: 30px; font-size: 13px; box-shadow: var(--shadow);

  opacity: 0; transition: .3s; z-index: 4000; pointer-events: none; white-space: nowrap;

}

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }


::-webkit-scrollbar { width: 6px; }

::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }


/* 手机端专项适配 */

@media(max-width: 600px) {

  .summary-grid { gap: 6px; }

  .summary-card { padding: 10px 6px; }

  .summary-card .label { font-size: 10px; letter-spacing: .02em; margin-bottom: 4px; }

  .entry-content {

    padding: 12px 12px;

    gap: 10px;

  }

  .entry-actions {

    padding: 0 12px;

    gap: 6px;

  }

  .entry-icon { width: 32px; height: 32px; font-size: 17px; }

  .entry-main { gap: 4px; }

  .entry-name { font-size: 14px; }

  .entry-actions .icon-btn { width: 28px; height: 28px; font-size: 13px; }

  .gh-stats { font-size: 10.5px; gap: 6px; }

  .history-container { padding: 20px; }

  .history-title { font-size: 20px; }

  .history-content { font-size: 14px; }

}

</style>

</head>

<body>

<div class="wrap" id="app">


  <header>

    <h1 data-i18n="headerTitle">魏玛记账</h1>

    <div class="header-actions">

      <button class="theme-toggle" id="themeBtn" title="切换背景">🌙</button>

      <select class="lang-select" id="langSelect">

        <option value="zh-CN">中文（简体）</option>

        <option value="zh-TW">中文（繁體）</option>

        <option value="en-GB">English (UK)</option>

        <option value="ja-JP">日本語（日本）</option>

        <option value="de-DE">Deutsch (Deutschland)</option>

        <option value="ru-RU">Русский (Россия)</option>

        <option value="fr-FR">Français (France)</option>

      </select>

      <button class="btn btn-sm" id="historyBtn" data-i18n="historyBtn">关于通胀</button>

      <button class="btn btn-sm" id="syncBtn" data-i18n="dataManager">数据备份</button>

      <button class="btn btn-sm" id="toggleModeBtn" data-i18n="btnToMark">切换纸马克</button>

      <button class="btn btn-primary btn-sm" id="addBtn">＋ <span data-i18n="add">新增</span></button>

    </div>

  </header>


  <div class="rate-bar">

    <div class="status">

      <span class="dot loading" id="rateDot"></span>

      <span id="rateText" data-i18n="rateLoading">获取实时汇率中…</span>

    </div>

    <div>

      <span data-i18n="usdToCny">1 USD =</span>

      <span class="rate-val" id="usdCnyRate">--</span>

      <span data-i18n="cny">CNY</span>

      <span style="font-size:10px;color:var(--muted);margin-left:6px;" id="rateTime"></span>

      <button class="icon-btn" id="refreshRate" title="Refresh" style="display:inline-flex;margin-left:4px;">⟳</button>

    </div>

  </div>


  <div class="summary-grid">

    <div class="summary-card income">

      <div class="label" data-i18n="totalIncome">总收入</div>

      <div class="value" id="sumIncome">0.00</div>

    </div>

    <div class="summary-card expense">

      <div class="label" data-i18n="totalExpense">总支出</div>

      <div class="value" id="sumExpense">0.00</div>

    </div>

    <div class="summary-card total">

      <div class="label" data-i18n="netTotal">总额</div>

      <div class="value" id="sumTotal">0.00</div>

    </div>

  </div>


  <div id="listContainer"></div>

  <div class="empty" id="emptyState" style="display:none;">

    <div class="big">📒</div>

    <div data-i18n="emptyHint">还没有账目，点击右上角“新增”开始记录</div>

  </div>


  <div class="footer-area">

    <div class="rate-info" id="rateInfo"></div>

    <div class="cloud-guide" id="cloudGuide"></div>

  </div>


</div>


<!-- 主编辑弹窗 -->

<div class="modal-overlay" id="modalOverlay">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle" data-i18n="editTitle">编辑条目</h2>

      <button class="icon-btn" id="modalClose">✕</button>

    </div>

    <div class="modal-body">

      <div class="form-group">

        <label data-i18n="type">类型</label>

        <select id="fType">

          <option value="expense" data-i18n="expense">支出</option>

          <option value="income" data-i18n="income">收入</option>

        </select>

      </div>

      <div class="form-group">

        <label data-i18n="fieldName">名称 / 备注</label>

        <input type="text" id="fName" data-i18n-placeholder="fieldNamePlaceholder" placeholder="例如：工资、餐饮">

      </div>

      <div class="form-group">

        <label data-i18n="fieldPrice">金额（CNY）</label>

        <input type="number" id="fPrice" step="0.01" min="0" placeholder="0.00">

      </div>

      

      <div class="form-group">

        <label data-i18n="fieldDate">日期</label>

        <div class="date-input-group">

          <input type="number" id="fYear" placeholder="YYYY" min="1900" max="2100">

          <span data-i18n="year">年</span>

/* 金额渲染 */

function renderMoney(str) {

  if (!str || str === '—') return '<span class="money-num">—</span>';

  const idx = str.search(/[-\d]/);

  if (idx === -1) return `<span class="money-num">${str}</span>`;

  const sym = str.slice(0, idx).trim();

  const num = str.slice(idx);

  const symHtml = sym ? `<span class="money-sym">${sym}</span>` : '';

  return `${symHtml}<span class="money-num">${num}</span>`;

}


/* 日期工具 */

function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }

function getDaysInMonth(y, m) {

  if (!y || !m) return 31;

  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];

  if (m === 2 && isLeapYear(y)) return 29;

  return monthDays[m - 1] || 31;

}

function validateDateInput() {

  let y = parseInt(fYear.value), m = parseInt(fMonth.value), d = parseInt(fDay.value);

  if (isNaN(y)) y = new Date().getFullYear();

  if (isNaN(m)) m = new Date().getMonth() + 1;

  if (isNaN(d)) d = 1;

  if (m < 1) { m = 1; fMonth.value = 1; }

  if (m > 12) { m = 12; fMonth.value = 12; }

  const maxDays = getDaysInMonth(y, m);

  if (d < 1) { d = 1; fDay.value = 1; }

  if (d > maxDays) { d = maxDays; fDay.value = maxDays; }

  if (fDay.value === '') fDay.value = 1;

  fDay.setAttribute('max', maxDays);

}

fYear.addEventListener('input', validateDateInput);

fMonth.addEventListener('input', validateDateInput);

fDay.addEventListener('input', validateDateInput);


function parseDate(str) {

  if (!str) return null;

  const [y, m, d] = str.split('-').map(Number);

  return new Date(y, m - 1, d);

}

function fmtDate(d) {

  const y = d.getFullYear();

  const m = String(d.getMonth() + 1).padStart(2, '0');

  const dd = String(d.getDate()).padStart(2, '0');

  return `${y}-${m}-${dd}`;

}

function todayStr() { return fmtDate(new Date()); }


function formatVal(v, isMark) {

  if (!isFinite(v)) return '—';

  const num = isMark ? (v / usdCnyRate * MARK_PER_USD) : v;

  const formatted = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const sign = num < 0 ? '-' : '';

  const symbol = isMark ? 'ℳ ' : '￥ ';

  return `${symbol}${sign}${formatted}`;

}

function formatNum(v) {

  if (!isFinite(v)) return '—';

  return Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

}

function fmtMain(v) { return formatVal(v, isPapiermarkMode); }

function displayDate(str, lang) {

  const d = parseDate(str);

  if (!d) return '';

  if (lang === 'zh-CN' || lang === 'zh-TW' || lang === 'ja-JP') {

    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;

  }

  return d.toLocaleDateString(lang === 'de-DE' ? 'de-DE' : (lang === 'fr-FR' ? 'fr-FR' : (lang === 'ru-RU' ? 'ru-RU' : 'en-GB')), { day: '2-digit', month: 'short', year: 'numeric' });

}

/* 移动端检测 */

function isMobileDevice() {

  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent)

    || (navigator.maxTouchPoints > 0 && window.innerWidth < 1024);

}

/* ---------- 左滑交互核心逻辑 ---------- */

function getSwipeActionWidth() {

  // 读取CSS变量中的操作区宽度

  const style = getComputedStyle(document.documentElement);

  const width = parseInt(style.getPropertyValue('--swipe-action-width'));

  return isFinite(width) ? width : 88;

}

function getEventPoint(e) {

  if (e.touches && e.touches.length) {

    return { x: e.touches[0].clientX, y: e.touches[0].clientY };

  }

  return { x: e.clientX, y: e.clientY };

}

function closeAllSwipe(exceptEntry = null) {

  document.querySelectorAll('.entry.open').forEach(entry => {

    if (entry !== exceptEntry) {

      entry.classList.remove('open');

      const content = entry.querySelector('.entry-content');

      if (content) content.style.transform = '';

    }

  });

}

function handleSwipeStart(e) {

  const entry = e.target.closest('.entry');

  if (!entry) return;

  // 点击操作按钮本身不触发滑动

  if (e.target.closest('.entry-actions')) return;

  const point = getEventPoint(e);

  swipeStartX = point.x;

  swipeStartY = point.y;

  activeSwipeEntry = entry;

  isSwiping = false;

  swipeLockDirection = false;

  justSwiped = false;

  // 检测是否在名称滚动区域开始

  const nameScroll = e.target.closest('.entry-name-scroll');

  if (nameScroll) {

    isScrollingName = true;

    nameScrollEl = nameScroll;

    nameScrollStartX = point.x;

    nameScrollStartLeft = nameScroll.scrollLeft;

  } else {

    isScrollingName = false;

    nameScrollEl = null;

  }

  const content = entry.querySelector('.entry-content');

  if (content) {

    // 移除过渡，实时跟随手指

    content.style.transition = 'none';

    // 读取当前偏移量

    const transform = window.getComputedStyle(content).transform;

    if (transform !== 'none') {

      const matrix = new DOMMatrix(transform);

      swipeStartOffset = matrix.m41;

    } else {

      swipeStartOffset = 0;

    }

  }

  // 收起其他已展开的条目

  closeAllSwipe(entry);

}

function handleSwipeMove(e) {

  const point = getEventPoint(e);

  const deltaX = point.x - swipeStartX;

  const deltaY = point.y - swipeStartY;

  // 优先处理名称滚动

  if (isScrollingName && nameScrollEl) {

    if (e.cancelable) e.preventDefault();

    

    // 计算目标滚动位置

    const targetLeft = nameScrollStartLeft - deltaX;

    const maxScroll = nameScrollEl.scrollWidth - nameScrollEl.clientWidth;

    

    // 限制滚动范围

    nameScrollEl.scrollLeft = Math.max(0, Math.min(maxScroll, targetLeft));

    // 关键：只有当文字已经滑到最左端，且继续向左滑时，才触发条目左滑

    if (nameScrollEl.scrollLeft <= 0 && deltaX < -SWIPE_THRESHOLD) {

      isScrollingName = false;

      nameScrollEl = null;

      // 重置滑动起始点，从当前位置开始算条目左滑

      swipeStartX = point.x;

      swipeStartOffset = 0;

    } else {

      // 还在滚动文字范围内，不处理条目滑动

      return;

    }

  }

  if (!activeSwipeEntry) return;

  // 方向锁定：一旦判定为垂直滚动，全程不再触发滑动

  if (!swipeLockDirection) {

    if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 5) {

      swipeLockDirection = true;

      activeSwipeEntry = null;

      return;

    }

    if (Math.abs(deltaX) > SWIPE_THRESHOLD) {

      swipeLockDirection = true;

      isSwiping = true;

    }

  }

  if (isSwiping) {

    // 阻止页面水平滚动

    if (e.cancelable) e.preventDefault();

    const content = activeSwipeEntry.querySelector('.entry-content');

    if (!content) return;

    const actionWidth = getSwipeActionWidth();

    let targetX = swipeStartOffset + deltaX;

    // 限制滑动范围：0（收起） ~ -actionWidth（完全展开）

    targetX = Math.max(-actionWidth, Math.min(0, targetX));

    content.style.transform = `translateX(${targetX}px)`;

  }

}

function handleSwipeEnd() {

  // 重置名称滚动状态

  isScrollingName = false;

  nameScrollEl = null;

  if (!activeSwipeEntry) {

    swipeLockDirection = false;

    return;

  }

  const content = activeSwipeEntry.querySelector('.entry-content');

  if (!content) {

    activeSwipeEntry = null;

    isSwiping = false;

    swipeLockDirection = false;

    return;

  }

  // 恢复过渡动画

  content.style.transition = '';

  // 读取当前偏移

  const transform = window.getComputedStyle(content).transform;

  let currentX = 0;

  if (transform !== 'none') {

    const matrix = new DOMMatrix(transform);

    currentX = matrix.m41;

  }

  const actionWidth = getSwipeActionWidth();

  const wasOpen = activeSwipeEntry.classList.contains('open');

  

  // 超过一半宽度则展开，否则回弹收起

  if (currentX < -actionWidth / 2) {

    activeSwipeEntry.classList.add('open');

    content.style.transform = `translateX(${-actionWidth}px)`;

    // 如果是新展开的，标记为刚滑动过

    if (!wasOpen) {

      justSwiped = true;

      setTimeout(() => { justSwiped = false; }, 300);

    }

  } else {

    activeSwipeEntry.classList.remove('open');

    content.style.transform = '';

    // 如果是从展开状态收起来的，也标记一下

    if (wasOpen) {

      justSwiped = true;

      setTimeout(() => { justSwiped = false; }, 300);

    }

  }

  activeSwipeEntry = null;

  isSwiping = false;

  swipeLockDirection = false;

}

/* 汇率获取 */

function extractUsdCny(data) {

  if (!data) return null;

  if (data.rates && data.rates.CNY != null) {

    const r = parseFloat(data.rates.CNY);

    return isFinite(r) && r > 0 ? r : null;

  }

  if (Array.isArray(data)) {

    const row = data.find(item => item && item.quote === 'CNY' && item.rate != null);

    if (row) {

      const r = parseFloat(row.rate);

      return isFinite(r) && r > 0 ? r : null;

    }

  }

  return null;

}

async function fetchRateFromWeb() {

  for (const url of RATE_SOURCES) {

    try {

      const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });

      if (!res.ok) continue;

      const data = await res.json();

      const rate = extractUsdCny(data);

      if (rate) return rate;

    } catch (e) { }

  }

  return null;

}

async function fetchRealRate(manual = false) {

  const btn = $('refreshRate');

  const oldRate = realRate;

  if (manual) {

    rateStatus = 'loading';

    updateRateStatusText();

    btn.classList.add('spinning');

    btn.disabled = true;

    $('rateDot').className = 'dot loading';

  }

  const newRate = await fetchRateFromWeb();

  if (newRate && newRate > 0) {

    realRate = newRate;

    usdCnyRate = realRate;

    persistRate(realRate);

    usdRateDisplay.textContent = usdCnyRate.toFixed(4);

    $('rateDot').className = 'dot ok';

    rateStatus = manual ? (Math.abs(oldRate - realRate) < 1e-6 ? 'unchanged' : 'ok') : 'ok';

    updateRateStatusText();

    updateAmounts();

  } else {

    const cached = loadRateCache();

    realRate = cached ? cached.rate : FALLBACK_USD_CNY;

    usdCnyRate = realRate;

    usdRateDisplay.textContent = usdCnyRate.toFixed(4);

    $('rateDot').className = 'dot err';

    rateStatus = 'err';

    updateRateStatusText();

    updateAmounts();

  }

  if (manual) {

    btn.classList.remove('spinning');

    btn.disabled = false;

  }

}

}

function loadRateCache() {

    if (!raw) return null;

    const obj = JSON.parse(raw);

    return (obj.rate && obj.date) ? obj : null;

  } catch (e) { return null; }

}

/* 数据与列表渲染 */

function loadEntries() {

  try {

    const raw = localStorage.getItem(STORAGE_KEY);

    entries = raw ? JSON.parse(raw) : [];

    if (!Array.isArray(entries)) entries = [];

    entries.forEach(e => {

      if (!e.type) e.type = 'expense';

      if (!e.id) e.id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random();

    });

  } catch (e) { entries = []; }

}

function saveEntries() {

  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}

}

function exportData() {

  if (!entries || entries.length === 0) { toastMsg('当前没有数据可以导出'); return; }

  try {

    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });

    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');

    a.href = url; a.download = `weimar_ledger_${todayStr()}.json`; a.style.display = 'none';

    document.body.appendChild(a); a.click();

    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);

    toastMsg(t('syncSuccess'));

  } catch (err) { toastMsg('导出失败，请使用下方的“复制文本”'); }

}

function handleImportFile(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = (e) => {

    try {

      const imported = JSON.parse(e.target.result);

      if (Array.isArray(imported)) {

        entries = imported;

        entries.forEach(e => { if (!e.id) e.id = Date.now() + '-' + Math.random(); });

        saveEntries(); render(); closeSyncModal(); toastMsg(t('syncLoadOk'));

      } else throw new Error();

    } catch (err) { toastMsg(t('syncErr')); }

  };

  reader.readAsText(file);

  event.target.value = '';

}

function copyText() {

  if (!entries || entries.length === 0) { toastMsg('当前没有数据'); return; }

  const text = JSON.stringify(entries);

  navigator.clipboard.writeText(text).then(() => toastMsg(t('copyData'))).catch(() => {

    dataTextArea.value = text; dataTextArea.select(); document.execCommand('copy'); toastMsg(t('copyData'));

  });

}

function loadFromText() {

  try {

    const text = dataTextArea.value.trim();

    if (!text) return;

    const imported = JSON.parse(text);

    if (Array.isArray(imported)) {

      entries = imported;

      entries.forEach(e => { if (!e.id) e.id = Date.now() + '-' + Math.random(); });

      saveEntries(); render(); closeSyncModal(); toastMsg(t('syncLoadOk'));

    } else throw new Error();

  } catch (e) { toastMsg(t('syncErr')); }

}

}

/* 条目HTML - 左滑结构：操作按钮后置，内容层前置覆盖 */

  const valCNY = isInc ? e.price : -e.price;

  const strCNY = `￥ ${valCNY < 0 ? '-' : ''}${formatNum(valCNY)}`;

  const strPM = `ℳ ${valPM < 0 ? '-' : ''}${formatNum(valPM)}`;

  const innerHTML = isPapiermarkMode

/* 弹窗与保存 */

function openNew() {

  editingId = null; modalTitle.textContent = t('newTitle'); deleteBtn.style.display = 'none';

  fType.value = 'expense'; fName.value = ''; fPrice.value = '';

  const today = new Date();

  fYear.value = today.getFullYear(); fMonth.value = today.getMonth() + 1; fDay.value = today.getDate();

  validateDateInput();

  modalOverlay.classList.add('show');

  setTimeout(() => fName.focus(), 200);

function openEdit(id) {

  const e = entries.find(x => String(x.id) === String(id)); if (!e) return;

  editingId = e.id; modalTitle.textContent = t('editTitle'); deleteBtn.style.display = 'inline-flex';

  fType.value = e.type || 'expense'; fName.value = e.name; fPrice.value = e.price;

  const d = parseDate(e.date);

  if (d) { fYear.value = d.getFullYear(); fMonth.value = d.getMonth() + 1; fDay.value = d.getDate(); }

  else { fYear.value = ''; fMonth.value = ''; fDay.value = ''; }

  validateDateInput();

  modalOverlay.classList.add('show');

}

function closeModal() { modalOverlay.classList.remove('show'); }

function openSyncModal() { dataTextArea.value = ''; syncModalOverlay.classList.add('show'); }

function closeSyncModal() { syncModalOverlay.classList.remove('show'); }


function saveEntry() {

  const name = fName.value.trim(), price = parseFloat(fPrice.value), type = fType.value;

  let y = parseInt(fYear.value), m = parseInt(fMonth.value), d = parseInt(fDay.value);

  if (!name) { toastMsg('请输入名称'); return; }

  if (!isFinite(price) || price < 0) { toastMsg('请输入有效金额'); return; }

  if (isNaN(y) || isNaN(m) || isNaN(d)) { toastMsg('请填写完整日期'); return; }

  const maxDays = getDaysInMonth(y, m); if (d > maxDays) d = maxDays;

  const pad = n => n.toString().padStart(2, '0');

  const date = `${y}-${pad(m)}-${pad(d)}`;

  const data = { name, price, date, type };

  if (editingId) {

    const idx = entries.findIndex(e => String(e.id) === String(editingId));

    if (idx >= 0) entries[idx] = { ...entries[idx], ...data };

  } else {

    const newId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random();

    entries.push({ id: newId, ...data });

  }

  saveEntries(); closeModal(); render(); toastMsg(t('toastSaved'));

}

function deleteEntry(id) {

  const idx = entries.findIndex(e => String(e.id) === String(id));

  if (idx > -1) { entries.splice(idx, 1); saveEntries(); closeModal(); render(); toastMsg(t('toastDeleted')); }

}
